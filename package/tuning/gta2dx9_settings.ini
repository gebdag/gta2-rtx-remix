; GTA2 RTX Remix -- everything the F4 menu can change.
;
; Written by the Save button, read at startup. Separate from gta2dx9.ini on
; purpose: deploy regenerates that one on every build, so anything saved into
; it would be lost. Where the two overlap this file wins.
;
; Per-light overrides are in gta2dx9_lights.ini and the effect categories in
; gta2dx9_effects.ini; the Save button writes all three.

[lights]
Enabled=1
InjectStatic=1
InjectMoving=1
AmbientFill=0
Brightness=20.00000
MovingScale=1.00000
ReferenceRadius=3.00000
RadiusExponent=1.00000
Saturation=1.00000
EmitterRadius=0.15000
MinIntensity=0.00400
AmbientFillScale=1.00000
ConeSoftness=0.35000

[render]
SpriteLift=0.0360
AlphaMode=test
AlphaRef=128
