; GTA2 RTX Remix -- lights for effects the game does not light itself.
;
; Bind lines map a particle type id to a category. GTA2 gives every particle
; a type at +0x38; which id is which effect is not written down anywhere, so
; the F4 menu's Effects tab lists the ids as they appear and you bind them by
; triggering the effect and watching which one lights up.
;
; Categories: 0=Muzzle flash, 1=Bullet, 2=Sparks, 3=Cigarette, 4=Fire, 5=Headlights
; Headlights take no particle types -- they come off the vehicle list.

[general]
Enabled=1
DrivenWindowMs=2500
DrivenMinMovement=0.00400
Bind=03 4
Bind=04 4
Bind=07 2
Bind=16 4
Bind=24 4
Bind=26 1
Bind=28 0
Bind=29 0

