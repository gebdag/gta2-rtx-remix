# RTX Remix bridge settings for gta2dx9.
#
# The renderer places GTA2's street lights, and runs the day/night clock,
# through the Remix API. A 32-bit game reaches that API through the bridge,
# and the bridge keeps it switched off unless this says otherwise - without
# it the F4 menu reports "Remix API is switched off" and the city has no
# lights of its own.
#
# If you already had a .trex\bridge.conf, keep your own settings and add just
# this line to it.
exposeRemixApi = True
