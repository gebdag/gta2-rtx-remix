; Montreal's sun for the Plateau map. Copy these lines into the [timeofday]
; section of gta2dx9.ini (or set the same values on the Time of day tab of the
; F4 menu, then Save).
;
; Montreal is at 45.5 degrees north. The declination sets the season:
;   +234  late June    sunset about 20:45, the long summer evenings
;      0  March, September
;   -166  early November
;   -234  late December  sunset about 16:15
; The lamp times below match early November. For a summer evening use
; declination_tenths=234, lights_off_hhmm=530 and lights_on_hhmm=2030.

[timeofday]
latitude_tenths=455
declination_tenths=-166
lights_off_hhmm=700
lights_on_hhmm=1630
; Start at dusk on Mont-Royal.
start_hhmm=1700
