; Montreal's sun for the Plateau map.
;
; How to use it: open gta2dx9.ini, find the [timeofday] section, and change the
; values of these five keys to the ones below. Change the lines that are already
; there. Do not add a second copy of a key, and do not paste a second
; [timeofday] header: the game reads only the first of each.
;
; If you have ever pressed Save in the F4 menu, gta2dx9_settings.ini also exists,
; and its values win over gta2dx9.ini. Then set these in the F4 menu instead, on
; the Time of day tab, and press Save:
;   Latitude 45.5, Declination -16.6, start hour 17, lights off 7.25,
;   lights on 16.75
;
; Montreal is at 45.5 degrees north. The declination sets the season. The
; renderer's clock is local solar time: noon is when the sun is highest, and
; there is no daylight-saving time. Its sunrise and sunset at 45.5 north:
;   +234  late June       sunrise 04:16, sunset 19:44
;      0  March, September sunrise 06:00, sunset 18:00
;   -166  early November   sunrise 07:11, sunset 16:49
;   -234  late December    sunrise 07:44, sunset 16:16
; The lamp times below match early November. For a summer evening use
; declination_tenths=234, lights_off_hhmm=415 and lights_on_hhmm=1945.

[timeofday]
latitude_tenths=455
declination_tenths=-166
lights_off_hhmm=715
lights_on_hhmm=1645
; Start at dusk.
start_hhmm=1700
